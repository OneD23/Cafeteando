name: Cafe-Track CI (base remota)
run-name: Cafe-Track CI - ${{ github.ref_name }}
on:
  push:
    branches:
      - chatgpt/ci-base-20261124
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafetrack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Backend tests
        run: npm test

  mobile:
    name: Mobile - TypeScript and web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cafetrack-mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cafetrack-mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and screen integrity
        run: npm test
      - name: Web export
        run: npm run export:web
